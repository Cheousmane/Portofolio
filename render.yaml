services:
  - type: web
    name: sidtech
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: sidibeousmanemohamed@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: sidibeousmanemohamed@gmail.com
      - key: MAIL_FROM_NAME
        value: "SID-TECH Contact"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sidtech-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sidtech-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sidtech-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sidtech-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sidtech-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file

databases:
  - name: sidtech-db
    region: frankfurt
    plan: free
    databaseName: sidtech
